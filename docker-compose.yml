services:
  app:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-digit-catalog-analyzer}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://catalog:catalog@db:5432/catalog}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://catalog:catalog@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      EXTERNAL_API_BASE_URL: ${EXTERNAL_API_BASE_URL:-}
      CANDIDATE_ID: ${CANDIDATE_ID:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      MAX_DOWNLOAD_BATCH_SIZE: ${MAX_DOWNLOAD_BATCH_SIZE:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    environment:
      APP_NAME: ${APP_NAME:-digit-catalog-analyzer}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://catalog:catalog@db:5432/catalog}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://catalog:catalog@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      EXTERNAL_API_BASE_URL: ${EXTERNAL_API_BASE_URL:-}
      CANDIDATE_ID: ${CANDIDATE_ID:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      MAX_DOWNLOAD_BATCH_SIZE: ${MAX_DOWNLOAD_BATCH_SIZE:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: catalog
      RABBITMQ_DEFAULT_PASS: catalog
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
